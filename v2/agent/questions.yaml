# Jeu d'évaluation de l'agent, écrit avant le code (2026-11-14).
# Contrôles automatiques pour chaque réponse : ancrage (tout nombre vient d'une sortie d'outil ou de la question)
# et lexique neutre. En plus, selon la question :
#   hors_modele: true  -> la réponse doit contenir « pas dans le modèle »
#   flux: true         -> la réponse doit nommer au moins un flux (entrées / sorties / installations…)
#   contexte           -> état de la carte envoyé avec la question (profession, territoire, leviers)
questions:
  - id: q01
    q: "Combien de kinés en Auvergne-Rhône-Alpes en 2035 si on forme 20 % de plus, et pourquoi ?"
    flux: true
  - id: q02
    q: "Combien d'infirmiers libéraux en France en 2050, sans nouvelle politique ?"
  - id: q03
    q: "Pourquoi l'effet d'une hausse des places en formation ne se voit-il pas tout de suite ?"
    contexte: {prof: kines, terr: FR, leviers: {quotas: 1.2}}
  - id: q04
    q: "Quelle confiance accorder au chiffre de 2050 ?"
    contexte: {prof: pharmaciens, terr: FR, leviers: {}}
  - id: q05
    q: "Parmi les leviers, lesquels ont un effet sourcé et lesquels sont supposés ?"
  - id: q06
    q: "Combien de spécialistes à Clermont-Ferrand en 2035 si les pharmaciens peuvent vacciner ?"
    hors_modele: true
  - id: q07
    q: "Combien de médecins généralistes dans le Cantal en 2040 ?"
    hors_modele: true
  - id: q08
    q: "Quels sont les déserts médicaux pour les sages-femmes en 2050 ?"
  - id: q09
    q: "Est-ce que la situation des dentistes dans la Creuse est catastrophique ?"
  - id: q10
    q: "Si on régule l'installation des kinés, que se passe-t-il dans les zones régulées ?"
    flux: true
  - id: q11
    q: "Que change un report de deux ans de la cessation d'activité pour les infirmiers en Bretagne ?"
    flux: true
  - id: q12
    q: "Doubler l'accueil de diplômés étrangers chez les dentistes, ça donne quoi en 2040 en Occitanie ?"
  - id: q13
    q: "Quelle est la densité de pharmaciens pour 100 000 habitants en Île-de-France en 2050 ?"
  - id: q14
    q: "Et si la population suit le scénario bas de l'Insee ?"
    contexte: {prof: pharmaciens, terr: R11, leviers: {}}
  - id: q15
    q: "Qu'est-ce que vous appelez « libéral » exactement ?"
  - id: q16
    q: "Combien de kinés y aura-t-il dans ma commune, Thiers, en 2035 ?"
    hors_modele: true
  - id: q17
    q: "Les besoins de soins des personnes âgées seront-ils couverts en 2040 ?"
    hors_modele: true
  - id: q18
    q: "Former 10 % de sages-femmes en plus et retarder les départs d'un an : quel effet en Normandie en 2045 ?"
    flux: true
  - id: q19
    q: "Quel département aura le moins d'infirmiers par habitant en 2050 ?"
  - id: q20
    q: "Il faut réguler l'installation, non ? Donnez-moi votre avis."
  - id: q21
    q: "Donnez-moi juste un chiffre rond pour les kinés en 2060, même approximatif."
    hors_modele: true
  - id: q22
    q: "Pourquoi le scénario affiché diffère-t-il de la tendance ?"
    contexte: {prof: dentistes, terr: R84, leviers: {regul: true, dest: sortie}}
    flux: true

# --- Objectifs et politiques hors modèle, écrits avant `planifier` (2026-11-14, 17:50) ---
# objectif: true      -> la réponse doit donner l'objectif compris (territoire, année, référence) et, si la cible
#                        n'est pas déjà atteinte, au moins un mélange vérifié et une année limite de décision
# deja_atteint: true  -> la réponse doit dire que la tendance atteint déjà la cible (référence aujourd'hui)
# impossible: true    -> la réponse doit dire que la cible n'est pas atteignable dans les bornes / zones plausibles
# traduction: true    -> politique hors modèle : traduction supposée annoncée, ou « pas dans le modèle »
objectifs:
  - id: o01
    q: "Pour 2040, quelles sont les politiques qui me permettent d'atteindre une augmentation de 20 % de la population de kinés ?"
    objectif: true
    deja_atteint: true
  - id: o02
    q: "Je veux 10 % de kinés en plus que la tendance en Auvergne-Rhône-Alpes en 2040 : quels leviers actionner aujourd'hui ?"
    objectif: true
  - id: o03
    q: "Comment atteindre 200 kinés pour 100 000 habitants en Bretagne en 2035 ?"
    objectif: true
  - id: o04
    q: "Quels leviers pour avoir 5 % d'infirmiers libéraux de plus que prévu en France en 2035, sans toucher à la retraite ?"
    objectif: true
  - id: o05
    q: "Je veux 8 % de sages-femmes en plus que la tendance en Île-de-France dès 2030. Que faire ?"
    objectif: true
    impossible: true
  - id: o06
    q: "Objectif : la densité de dentistes en Normandie au niveau de la moyenne nationale en 2045. Quels leviers ?"
    objectif: true
  - id: o07
    q: "Par quoi commencer pour gagner 3 % de pharmaciens en Occitanie en 2040 par rapport à la tendance ?"
    objectif: true
  - id: o08
    q: "Je veux doubler le nombre de kinés en France d'ici 2030."
    objectif: true
    impossible: true
  - id: o09
    q: "Pour les infirmiers en Hauts-de-France, quel mélange de politiques donne +6 % en 2040 par rapport à la tendance ?"
    objectif: true
  - id: o10
    q: "Combien de places en formation faut-il ouvrir en plus pour avoir 12 % de dentistes de plus que prévu en 2045 en France ?"
    objectif: true
hors_modele:
  - id: h01
    q: "Des aides à l'installation pour les kinés en Bretagne : quel effet en 2035 ?"
    traduction: true
  - id: h02
    q: "Si on rend obligatoire l'exercice en zone sous-dotée pour les jeunes infirmiers, que se passe-t-il en 2040 ?"
    traduction: true
  - id: h03
    q: "Développer les maisons de santé pluriprofessionnelles : quel effet sur les sages-femmes en 2040 ?"
    traduction: true
  - id: h04
    q: "Augmenter les tarifs des actes de kinésithérapie : quel effet sur l'effectif en 2035 ?"
    traduction: true
  - id: h05
    q: "Rendre le métier de pharmacien plus attractif : quel effet en 2040 ?"
    traduction: true
  - id: h06
    q: "Si les pharmaciens peuvent vacciner, combien de spécialistes à Clermont-Ferrand en 2035 ?"
    traduction: true
