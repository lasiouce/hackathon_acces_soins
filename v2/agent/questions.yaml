# Jeu d'évaluation de l'agent, écrit avant le code (2026-11-14).
# Contrôles automatiques pour chaque réponse : ancrage (tout nombre vient d'une sortie d'outil ou de la question)
# et lexique neutre. En plus, selon la question :
#   hors_modele: true  -> la réponse doit contenir « pas dans le modèle »
#   flux: true         -> la réponse doit nommer au moins un flux (entrées / sorties / installations…)
#   contexte           -> état de la carte envoyé avec la question (profession, territoire, leviers)
questions:
