# Neutralisation du lexique (docs/lab/lexicon.md) : terme jugeant -> formulation neutre.
neutralisation:
  - {terme: desert medical, neutre: territoire à accès moindre (densité inférieure à la moyenne)}
  - {terme: deserts medicaux, neutre: territoires à accès moindre (densité inférieure à la moyenne)}
  - {terme: mediocre, neutre: moindre (que la moyenne nationale ou régionale)}
  - {terme: mauvais, neutre: moindre (que la moyenne)}
  - {terme: penurie, neutre: écart entre l'offre projetée et les besoins projetés}
  - {terme: manque, neutre: écart entre l'offre projetée et les besoins projetés}
  - {terme: sur dotee, neutre: à densité supérieure à la moyenne}
  - {terme: sur dotees, neutre: à densité supérieure à la moyenne}
  - {terme: sur dote, neutre: à densité supérieure à la moyenne}
  - {terme: sous dotee, neutre: à densité inférieure à la moyenne}
  - {terme: sous dotees, neutre: à densité inférieure à la moyenne}
  - {terme: trop de professionnels, neutre: densité supérieure à la moyenne}
  - {terme: catastrophique, neutre: la densité diminue de X % d'ici l'horizon (chiffre à lire dans la projection)}
  - {terme: critique, neutre: la densité diminue de X % d'ici l'horizon (chiffre à lire dans la projection)}
  - {terme: alarmante, neutre: la densité diminue de X % d'ici l'horizon (chiffre à lire dans la projection)}
  - {terme: abandonnes, neutre: où la densité a le plus baissé}
  - {terme: oublies, neutre: où la densité a le plus baissé}
  - {terme: mauvais eleve, neutre: en dessous de la moyenne}
  - {terme: bon eleve, neutre: au-dessus de la moyenne}
  - {terme: echec, neutre: effet projeté de +/− N professionnels}
  - {terme: il faut, neutre: le scénario X conduit à …}
  - {terme: doivent, neutre: le scénario X conduit à …}
  - {terme: on doit, neutre: le scénario X conduit à …}
  - {terme: prevision, neutre: projection sous hypothèses}

# Politiques reconnues mais absentes du jumeau, avec la raison.
non_modelises:
  obligation_zone:
    libelle: Obligation d'exercice en zone sous-dotée
    termes: [obligation d exercer, obligation d exercice, obligation d installation, zone sous dotee,
             zones sous dotees, exercer en zone, affectation obligatoire]
    raison: "Le jumeau n'a pas de flux d'affectation contrainte des jeunes diplômés ; la régulation « un départ pour une arrivée » est le seul levier d'installation modélisé."
    source: null
  exercice_coordonne:
    libelle: Maisons et centres de santé, exercice coordonné
    termes: [maison de sante, maisons de sante, msp, centre de sante, centres de sante, exercice coordonne, cpts]
    raison: "Le jumeau ne distingue pas le mode d'exercice coordonné et n'a pas d'effet estimé d'une maison de santé sur l'installation ou le départ des professionnels."
    source: null
  aides_installation:
    libelle: Aides ou primes à l'installation
    termes: [prime a l installation, primes a l installation, aide a l installation, aides a l installation,
             contrat d aide, incitations financieres, prime, primes, exoneration]
    raison: "Aucune élasticité de l'installation aux aides financières n'est estimée sur données ouvertes ; le jumeau ne relie pas un montant en euros à un flux."
    source: null
  cesp:
    libelle: Contrat d'engagement de service public (CESP)
    termes: [cesp, contrat d engagement de service public]
    raison: "Concerne surtout les étudiants en médecine (hors périmètre) et les dentistes ; pas de flux CESP dans le jumeau."
    source: "Code de l'éducation, art. L632-6 (CESP)"
  vaccination_officine:
    libelle: Vaccination en officine et autres transferts de tâches
    termes: [vacciner, vaccination, vaccinent, transfert de taches, transferts de taches, delegation de taches,
             nouvelles missions, prescription par le pharmacien, protocoles de cooperation]
    raison: "Le jumeau projette des effectifs, pas l'activité ni le recours aux soins : un transfert de tâches ne change pas le nombre de professionnels projeté."
    source: null
  ipa:
    libelle: Infirmiers en pratique avancée (IPA)
    termes: [pratique avancee, ipa, infirmiers en pratique avancee]
    raison: "Les IPA ne sont pas distingués dans les données d'effectifs utilisées ; pas de flux spécifique."
    source: "Code de la santé publique, art. L4301-1 (exercice en pratique avancée)"
  acces_direct:
    libelle: Accès direct (kiné, IPA, orthophoniste…)
    termes: [acces direct, sans prescription, sans ordonnance]
    raison: "Change le parcours et la demande, pas l'effectif : le jumeau ne modélise ni la demande ni l'activité."
    source: "Loi n° 2023-379 du 19 mai 2023 portant amélioration de l'accès aux soins par la confiance aux professionnels de santé"
  teleconsultation:
    libelle: Téléconsultation, télésoin
    termes: [teleconsultation, teleconsultations, telesoin, telemedecine]
    raison: "Agit sur l'accès et l'activité, pas sur le nombre de professionnels installés ; non modélisé."
    source: null
  quatrieme_annee_mg:
    libelle: 4e année de l'internat de médecine générale
    termes: [4e annee, quatrieme annee, 4eme annee, medecine generale, generalistes, medecins generalistes]
    raison: "La médecine générale est hors périmètre du projet (brief) ; le jumeau couvre 5 professions non médicales."
    source: null
  medecins_specialistes:
    libelle: Médecins spécialistes
    termes: [specialistes, medecins specialistes, cardiologues, dermatologues, ophtalmologues]
    raison: "Prévus en phase 2 ; aucun levier du prototype ne les couvre."
    source: null
