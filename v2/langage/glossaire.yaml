# Glossaire contrôlé du compilateur de politiques (v2/langage). Relisible, modifiable sans code.
# Tous les termes sont écrits en minuscules ; le compilateur ignore accents, casse, apostrophes et tirets.
# source : texte juridique quand il est connu avec certitude, sinon null (aucune référence inventée).
# Les clés de leviers et leurs bornes viennent de v2/prototype/server.py (LEVIERS_UI) : elles ne sont pas recopiées ici.

leviers:
  quotas:
    famille: former
    unite: multiplicateur          # 1,2 = +20 % de places
    termes: [numerus apertus, numerus clausus, quotas, quota, places en formation, places de formation,
             places en ifsi, places en ifmk, places, capacites de formation, capacites d accueil,
             nombre d etudiants, etudiants formes, admissions en formation, ifsi, ifmk]
    source: "Loi n° 2019-774 du 24 juillet 2019, art. 1 (numerus apertus pour médecine, maïeutique, odontologie, pharmacie) ; quotas IFSI et IFMK : arrêtés annuels (référence non citée)"
  quotas_region:
    famille: former
    unite: bascule
    termes: [seulement dans la region, uniquement dans la region, dans la region seulement, quotas regionaux,
             places regionales, seulement dans cette region]
    source: null
  etrangers:
    famille: attirer
    unite: multiplicateur
    termes: [diplomes etrangers, diplome etranger, diplomes a l etranger, padhue, evc,
             epreuves de verification des connaissances, reconnaissance des diplomes,
             praticiens a diplome hors union europeenne, professionnels etrangers, diplomes hors ue]
    source: "Code de la santé publique, art. L4111-2 (autorisation d'exercice des titulaires de diplômes hors UE, épreuves de vérification des connaissances)"
  regul:
    famille: installer
    unite: bascule
    termes: [regulation a l installation, regulation de l installation, reguler l installation, regulation,
             reguler, regulant, regule, regulee, regulees, regules, regulera, conventionnement selectif, conventionnement, zonage,
             un depart pour une arrivee, une arrivee pour un depart, remplacement d un depart,
             installation regulee, installation conditionnee]
    source: null    # avenants conventionnels par profession (infirmiers, kinés, sages-femmes, dentistes) : références non vérifiées ici
  part_zones:
    famille: installer
    unite: part     # repérée par « N % des zones », « la moitié des zones »… quand la régulation est demandée
    termes: [des zones, zones regulees]
    source: null
  dest:
    famille: installer
    unite: option
    options:
      salariat: [salariat, salaries, vers le salariat, en salariat, deviennent salaries]
      sortie: [quittent la profession, hors de la profession, quitter la profession, sortent de la profession, abandonnent]
      voisine: [zone voisine, zones voisines, departement voisin, a cote, voisine]
    source: null
  retraite:
    famille: retenir
    unite: ans
    termes: [age de depart a la retraite, age de la retraite, age legal, retraite, cessation d activite,
             fin d activite, en activite]
    source: "Loi n° 2023-270 du 14 avril 2023 de financement rectificative de la sécurité sociale pour 2023 (report de l'âge légal)"
  cumul:
    famille: retenir
    unite: multiplicateur
    termes: [cumul emploi retraite, cumul emploi et retraite, cumul activite retraite, retraites actifs,
             retraite active, cumul]
    source: "Code de la sécurité sociale, art. L161-22 (cumul emploi-retraite)"
  precoces:
    famille: retenir
    unite: multiplicateur
    termes: [departs anticipes, departs avant 60 ans, depart avant 60 ans, departs precoces,
             abandons en cours de carriere, sorties precoces, departs prematures, cessations precoces]
    source: null

# Verbes et formules de direction. effet : hausse | baisse | facteur (valeur imposée) | annule.
directions:
  hausse: [augmenter, augmente, augmentant, augmentation, hausse, plus, accroitre, relever, encourager,
           renforcer, reculer, repousser, decaler, prolonger, retarder, davantage, supplementaires,
           supplementaire, ouvrir, elargir, developper]
  baisse: [reduire, reduisant, reduction, baisser, baisse, diminuer, diminution, moins, limiter,
           freiner, restreindre, avancer]
  facteurs:            # formule -> multiplicateur (leviers multiplicateurs)
    doubler: 2.0
    double: 2.0
    deux fois plus: 2.0
    tripler: 3.0
    triple: 3.0
    diviser par deux: 0.5
    divise par deux: 0.5
    moitie moins: 0.5
    reduire de moitie: 0.5
    de moitie: 0.5          # avec un verbe de baisse ; « moitié plus » donne 1,5
    moitie plus: 1.5
    supprimer: 0.0
    interdire: 0.0
    zero: 0.0
  plafonner: [plafonner, plafond, au maximum]   # reconnu, sans valeur chiffrée : signalé
unites:
  pourcent: ["%", pour cent, pourcent, points]
  ans: [an, ans, annee, annees]
  mois: [mois]
  fois: ["x", "×", fois]
nombres:
  un: 1
  une: 1
  deux: 2
  trois: 3
  quatre: 4
  cinq: 5
  six: 6
  sept: 7
  huit: 8
  neuf: 9
  dix: 10
  quinze: 15
  vingt: 20
  trente: 30
  quarante: 40
  cinquante: 50
  cent: 100

professions:
  sages-femmes: [sages femmes, sage femme, maieutique, maieuticien, maieuticiens, maieuticiennes]
  dentistes: [chirurgiens dentistes, chirurgien dentiste, dentistes, dentiste, odontologie]
  pharmaciens: [pharmaciens, pharmacien, pharmaciennes, pharmacienne, officine, officines, pharmacie, pharmacies]
  kines: [masseurs kinesitherapeutes, masseur kinesitherapeute, kinesitherapeutes, kinesitherapeute,
          kinesitherapie, kines, kine, mk, ifmk]
  infirmiers: [infirmiers, infirmier, infirmieres, infirmiere, ide, idel, ifsi]

