# Transferts de tâches HYPOTHÉTIQUES (proposés par l'utilisateur·rice, forme de L23, paramètres de l'utilisateur) —
# 10 phrases écrites le 2026-11-15 AVANT le code (session besoin-axe5-sensibilite), non ajustées ensuite. Pas à l'aveugle.
# Convention : `hypothetique` = {source, cible, mode, p} ; mode « acte » (p % d'un acte : s∞ = p) ou « demande »
# (p % de la demande ou du temps de la source : a = p) ; null = aucun transfert hypothétique attendu.
# `profession` = profession dont la couverture est demandée.
