<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offre libérale — carte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --ground:#F4F5F2; --sea:#D5DADF; --panel:#FFFFFF; --ink:#16181A; --mute:#5C6166; --faint:#8A8F94;
  --line:#DCDED8; --sel:#1B3A8C;
  /* une couleur fixe par profession (ni rouge ni vert) */
  --p-sages-femmes:#7A4E8C; --p-dentistes:#2F6A8A; --p-pharmaciens:#8A6A1E; --p-kines:#3D4F9E;
  --prof:var(--p-kines);
  --r:10px; --sh:0 1px 2px rgba(22,24,26,.06),0 8px 24px -6px rgba(22,24,26,.16);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ground);color:var(--ink);
  font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:color-mix(in srgb,var(--prof) 22%,transparent)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#map{position:fixed;inset:0}
.float{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}

/* barre du haut */
#top{top:16px;left:16px;right:16px;display:flex;gap:10px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
#brand{display:flex;align-items:center;gap:10px;padding:0 14px;height:48px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
#brand i{width:10px;height:10px;border-radius:2px;background:var(--prof);transition:background .4s var(--ease)}
#search{position:relative;width:min(320px,26vw);min-width:240px;flex-shrink:0}
#profs{min-width:0;overflow:hidden}
#search input{width:100%;height:48px;border:0;background:transparent;padding:0 14px 0 38px;outline:none}
#search svg{position:absolute;left:13px;top:16px;color:var(--faint)}
#results{position:absolute;top:52px;left:0;right:0;padding:4px;max-height:50vh;overflow:auto;display:none}
#results.on{display:block}
#results button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:8px 10px;border-radius:6px;text-align:left;cursor:pointer}
#results button[aria-selected=true],#results button:hover{background:var(--ground)}
#results small{color:var(--faint)}
#profs{display:flex;padding:4px;gap:2px;height:48px}
#profs button{border:0;background:none;padding:0 12px;border-radius:6px;cursor:pointer;color:var(--mute);display:flex;align-items:center;gap:7px;white-space:nowrap;transition:background .2s,color .2s}
#profs button i{width:8px;height:8px;border-radius:50%}
#profs button[aria-pressed=true]{background:var(--ground);color:var(--ink);font-weight:500}
#profs button[disabled]{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
#actions{display:flex;gap:6px}
.btn{height:48px;padding:0 14px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);cursor:pointer;box-shadow:var(--sh);display:flex;align-items:center;gap:8px;white-space:nowrap;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.97)}
.btn svg{color:var(--mute)}

/* leviers */
.fam{border-top:1px solid var(--line);padding-top:10px}
.fam>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;font-weight:600;padding:2px 0 8px}
.fam>summary::-webkit-details-marker{display:none}
.fam>summary small{font-weight:400;color:var(--mute);font-size:12px}
.fam>summary .on{font-size:11px;color:#fff;background:var(--ink);border-radius:9px;padding:1px 7px;margin-left:6px}
.fam .lev{margin:4px 0 14px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.badge{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--mute)}
.badge.sup{border-style:dashed}
.lev select{width:100%;font:inherit;padding:4px 6px;margin-top:4px}
.lev .sw{display:flex;gap:8px;align-items:center;font-size:13px}
#levers{top:80px;left:16px;width:336px;padding:0;overflow:hidden;transition:width .35s var(--ease)}
#levers header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
#levers h2{font-size:13px;margin:0;font-weight:600}
#levers .body{padding:16px;display:grid;gap:20px;transition:opacity .2s}
#levers.closed{width:112px}
#levers.closed .body{display:none}
#levers.closed header{border:0}
.icon{border:0;background:none;padding:4px;border-radius:6px;cursor:pointer;color:var(--mute);display:grid;place-items:center}
.icon:hover{background:var(--ground)}
.lev label{display:flex;justify-content:space-between;font-weight:500;margin-bottom:6px}
.lev label output{font-family:"IBM Plex Mono",monospace;font-size:13px}
.lev p{margin:6px 0 0;color:var(--mute);font-size:13px}
.lev.off{opacity:.6}
.lev.off .why{color:var(--ink);background:var(--ground);border-radius:6px;padding:6px 8px;margin-top:6px;font-size:12px}
input[type=range]{width:100%;accent-color:var(--prof);margin:0}
.seg{display:flex;background:var(--ground);border-radius:7px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:5px;padding:5px 6px;cursor:pointer;font-size:12px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* légende + latence */
#legend{left:16px;bottom:16px;padding:12px 14px;width:336px}
#legend .t{font-size:12px;color:var(--mute);margin-bottom:6px}
#legend .ramp{display:flex;height:8px;border-radius:2px;overflow:hidden}
#legend .ramp span{flex:1}
#legend .ticks{display:flex;justify-content:space-between;font:11px "IBM Plex Mono",monospace;color:var(--faint);margin-top:4px}
#lat{margin-top:8px;font:11px "IBM Plex Mono",monospace;color:var(--faint)}

/* zoom */
#zoom{right:16px;bottom:16px;display:flex;flex-direction:column;padding:3px}
#zoom button{width:40px;height:40px}

/* survol */
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;border-radius:7px;padding:8px 11px;font-size:13px;opacity:0;transition:opacity .12s;z-index:5;white-space:nowrap}
#tip b{font-weight:500}

/* fiche */
#card{top:80px;right:16px;width:432px;max-height:calc(100vh - 96px);overflow:auto;padding:0;
  transform:translateX(calc(100% + 24px));opacity:0;transition:transform .45s var(--ease),opacity .3s}
#card.on{transform:none;opacity:1}
#card header{padding:14px 16px 10px;display:flex;justify-content:space-between;gap:8px;position:sticky;top:0;background:var(--panel);z-index:1}
#card h3{margin:0;font-size:21px;letter-spacing:-.015em;text-wrap:balance}
#card .sub{color:var(--mute);font-size:12px}
#card section{padding:12px 16px;border-top:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.kpis div span{display:block;font-size:12px;color:var(--mute)}
.kpis div b{font-size:24px;font-weight:600;letter-spacing:-.02em}
.kpis div em{display:block;font-style:normal;font-size:11px;color:var(--faint)}
#chart{width:100%;height:180px;display:block}
.flows{display:grid;gap:6px}
.flow{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:8px;font-size:13px}
.flow .bar{height:8px;background:var(--ground);position:relative;border-radius:2px}
.flow .bar i{position:absolute;top:0;bottom:0;background:var(--prof);border-radius:2px;transition:all .35s var(--ease)}
.flow .bar:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--faint)}
.flow output{text-align:right;font-family:"IBM Plex Mono",monospace}
.note{font-size:13px;color:var(--mute);margin:6px 0 0}
.cardact{display:flex;gap:6px}
.cardact .btn{height:34px;box-shadow:none;font-size:13px}
.h4{font-size:12px;font-weight:600;margin:0 0 8px;color:var(--ink)}

/* comparaison */
#cmp{left:50%;bottom:16px;transform:translate(-50%,140%);transition:transform .4s var(--ease);padding:8px;display:flex;gap:6px;max-width:calc(100vw - 760px)}
#cmp.on{transform:translate(-50%,0)}
#cmp .c{padding:6px 10px;border-radius:7px;background:var(--ground);min-width:150px;position:relative}
#cmp .c b{display:block;font-size:12px;font-weight:600;padding-right:16px}
#cmp .c span{font-size:12px;color:var(--mute)}
#cmp .c button{position:absolute;right:4px;top:4px;padding:2px}
#toast{left:50%;top:76px;transform:translate(-50%,-10px);opacity:0;padding:8px 14px;transition:all .3s var(--ease);pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#err{color:var(--ink);background:#FFF4D6;border-color:#E2C779}
.maplibregl-ctrl-attrib{font-size:10px}

/* retour UAT : encarts de données plus grands, aucun texte sous 14 px */
#card{width:min(520px,36vw);min-width:400px}
.kpis div b{font-size:34px}
#card .sub,.note,.kpis div span,.kpis div em,.flow,.h4,.lev p,.seg button,#legend .t,#results small,#cmp .c span,#cmp .c b{font-size:14px}
#legend .ticks,#lat{font-size:13px}
#chart{height:250px}
#tip{font-size:15px;padding:10px 14px}
#levers{width:380px}#legend{width:380px}
#cmp .c{min-width:190px}
.flow{grid-template-columns:120px 1fr 80px}
/* A+ : agrandit tous les panneaux flottants */
#card,#legend,#levers,#cmp,#tip{zoom:1.15}
html.xl #card,html.xl #legend,html.xl #levers,html.xl #cmp,html.xl #tip{zoom:1.32}
#card{width:min(540px,32vw);max-height:calc((100vh - 110px)/1.15)}
html.xl #card{max-height:calc((100vh - 110px)/1.32)}
#crumb{top:80px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:4px 6px;font-size:15px;white-space:nowrap;max-width:calc(100vw - 900px)}
#crumb button{border:0;background:none;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--sel)}
#crumb button:hover{background:var(--ground)}
#crumb b{padding:6px 8px;font-weight:600}
#crumb i{color:var(--faint);font-style:normal}
@media (max-width:1200px){#crumb{left:410px;transform:none;max-width:calc(100vw - 440px)}#crumb .mid{display:none}#crumb .ell{display:inline}}
#crumb .ell{display:none}
@media (max-width:900px){#profs span{display:none}#levers{width:260px}#card{width:calc(100vw - 32px)}#cmp{max-width:calc(100vw - 32px)}#legend{width:240px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map" aria-label="Carte des départements"></div>

<div id="top" class="" style="position:fixed">
  <div id="brand" class="float" style="position:static"><i></i>Offre libérale 2050</div>
  <div id="search" class="float" style="position:relative">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
    <input id="q" placeholder="Commune, département ou région" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="results">
    <div id="results" class="float" style="position:absolute" role="listbox"></div>
  </div>
  <div id="profs" class="float" style="position:static" role="group" aria-label="Profession"></div>
  <div class="spacer"></div>
  <div id="actions"><button class="btn" id="txt" title="Taille du texte" aria-pressed="false">A+</button>
    <button class="btn" id="save" title="Copie un lien qui restaure ce scénario"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.5 9.5a3 3 0 0 0 4.2 0l2.6-2.6a3 3 0 0 0-4.2-4.2L8 3.8"/><path d="M9.5 6.5a3 3 0 0 0-4.2 0L2.7 9.1a3 3 0 0 0 4.2 4.2L8 12.2"/></svg>Enregistrer le scénario</button>
  </div>
</div>

<nav id="crumb" class="float" aria-label="Fil d'Ariane"></nav>
<aside id="levers" class="float">
  <header><h2>Leviers</h2>
    <button class="icon" id="fold" aria-label="Replier les leviers" aria-expanded="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m10 4-4 4 4 4"/></svg></button></header>
  <div class="body">
    <div id="levfam"></div>
    <div class="lev">
      <label>Couleur de la carte</label>
      <div class="seg" id="var">
        <button data-v="evo" aria-pressed="true">Évolution 2026 → 2050</button>
        <button data-v="ecart" aria-pressed="false">Écart au tendanciel</button>
      </div>
    </div>
  </div>
</aside>

<div id="legend" class="float"><div class="t" id="lt"></div><div class="ramp" id="ramp"></div><div class="ticks" id="ticks"></div><p class="note" style="margin:8px 0 0">Vue France : régions. Clic : la région s'ouvre en départements, puis clic sur un département. Maj + clic : le département directement.</p><div id="lat">—</div></div>

<div id="zoom" class="float">
  <button class="icon" id="zin" aria-label="Zoomer"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.6"><path d="M8 3v10M3 8h10"/></svg></button>
  <button class="icon" id="zout" aria-label="Dézoomer"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.6"><path d="M3 8h10"/></svg></button>
  <button class="icon" id="zfr" aria-label="Vue France entière"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg></button>
</div>

<aside id="card" class="float" aria-live="polite"></aside>
<div id="cmp" class="float"></div>
<div id="toast" class="float"></div>
<div id="tip"></div>

<script>
const PCOL={"sages-femmes":"#7A4E8C",dentistes:"#2F6A8A",pharmaciens:"#8A6A1E",kines:"#3D4F9E"};
// gamme divergente neutre : ocre (baisse) ↔ bleu encre (hausse), jamais rouge ni vert
const RAMP=["#8C5A1B","#B88A4E","#DCC39C","#C4C2B8","#A9B6D6","#6A80B8","#1B3A8C"];
const BREAKS={evo:[-.30,-.15,-.05,.05,.15,.30],ecart:[-.08,-.03,-.01,.01,.03,.08]};
const FLOWLBL={entrees:"Entrées",sorties:"Sorties",regulation:"Régulation",formation:"Formation",installations:"Installations"};
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString("fr-FR");
const pct=x=>(x>=0?"+":"−")+Math.abs(x*100).toLocaleString("fr-FR",{maximumFractionDigits:1})+" %";
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();

const S={prof:"kines",lv:{},v:"evo",terr:null,cmp:[]};
let META,GEO,REGL,regOf={},focusReg=null,carte=null,map,bbox={},names={},lat=[];

// ---------- état ↔ URL ----------
function readHash(){const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("p"))S.prof=h.get("p");if(h.get("l"))try{S.lvHash=Object.fromEntries(h.get("l").split(",").map(x=>x.split(":")));}catch{}if(h.get("v"))S.v=h.get("v");
  if(h.get("t"))S.terr=h.get("t");if(h.get("z"))S.xl=h.get("z")=="1";if(h.get("c"))S.cmp=h.get("c").split(",").filter(Boolean);}
function writeHash(){const h=new URLSearchParams({p:S.prof,l:Object.entries(S.lv).map(([k,v])=>k+":"+(typeof v=="boolean"?+v:v)).join(","),v:S.v});
  if(S.terr)h.set("t",S.terr);if(S.xl)h.set("z","1");if(S.cmp.length)h.set("c",S.cmp.join(","));history.replaceState(null,"","#"+h);if(META)crumb();}

// ---------- démarrage ----------
(async()=>{
  readHash();
  [META,GEO,REGL]=await Promise.all([fetch("/api/meta").then(r=>r.json()),fetch("/geo?v=c3").then(r=>r.json()),fetch("/geo-regions?v=c3").then(r=>r.json())]);
  for(const r of META.territories.slice(1))for(const d of r.deps)regOf[d.id]=r.id;
  for(const f of GEO.features){names["D"+f.properties.code]=f.properties.nom;bbox["D"+f.properties.code]=fbox(f.geometry);}
  for(const r of META.territories.slice(1)){names[r.id]=r.name;
    bbox[r.id]=r.deps.map(d=>bbox[d.id]).filter(Boolean).reduce((a,b)=>[Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.max(a[2],b[2]),Math.max(a[3],b[3])]);}
  names.FR="France";bbox.FR=[-7.8,41.3,9.6,51.1];   // inclut les encarts DROM à l'ouest
  buildProfs();buildMap();buildSearch();buildLevers();
})();

function fbox(g){let b=[180,90,-180,-90];const w=c=>typeof c[0]=="number"?(b=[Math.min(b[0],c[0]),Math.min(b[1],c[1]),Math.max(b[2],c[0]),Math.max(b[3],c[1])]):c.forEach(w);w(g.coordinates);return b;}

function buildProfs(){
  const el=$("#profs");
  for(const [k,l] of Object.entries(META.professions)){
    const b=document.createElement("button");b.innerHTML=`<i style="background:${PCOL[k]}"></i><span>${l}</span>`;
    b.dataset.p=k;b.onclick=()=>{S.prof=k;applyProf();refresh();};el.append(b);}
  for(const [k,why] of Object.entries(META.missing)){
    const b=document.createElement("button");b.disabled=true;b.title="Absent : "+why;b.innerHTML=`<i style="background:var(--line)"></i><span>Infirmiers</span>`;el.append(b);}
  applyProf();
}
function applyProf(){document.documentElement.style.setProperty("--prof",PCOL[S.prof]);
  document.querySelectorAll("#profs button[data-p]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.p==S.prof));}

// ---------- carte ----------
function buildMap(){
  map=new maplibregl.Map({container:"map",attributionControl:{compact:true,customAttribution:"Contours : IGN / Etalab · Données : jumeau v2"},
    style:{version:8,sources:{},layers:[{id:"bg",type:"background",paint:{"background-color":"#D5DADF"}}]},
    center:[2.4,46.6],zoom:5,dragRotate:false,pitchWithRotate:false});
  map.touchZoomRotate.disableRotation();
  map.on("load",()=>{
    try{map.fitBounds(bbox.FR,{padding:pad(false),duration:0});}catch(e){}
    map.addSource("d",{type:"geojson",data:GEO,promoteId:"code"});
    map.addLayer({id:"fill",type:"fill",source:"d",paint:{"fill-color":["step",["zoom"],["case",["boolean",["feature-state","f"],false],["coalesce",["feature-state","c"],"#F4F5F2"],["coalesce",["feature-state","cr"],"#F4F5F2"]],6.3,["coalesce",["feature-state","c"],"#F4F5F2"]],
      "fill-color-transition":{duration:300},
            "fill-opacity":1}});
    map.addLayer({id:"line",type:"line",source:"d",paint:{"line-color":"#FFFFFF","line-width":["interpolate",["linear"],["zoom"],4,.6,8,1.2],"line-opacity":["step",["zoom"],["case",["boolean",["feature-state","f"],false],1,.35],6.3,1]}});
    map.addSource("r",{type:"geojson",data:REGL,tolerance:0});
    map.addLayer({id:"regcase",type:"line",source:"r",filter:["!",["has","cote"]],paint:{"line-color":"#F4F5F2","line-width":["interpolate",["linear"],["zoom"],4,5,8,7]}});
    map.addLayer({id:"reg",type:"line",source:"r",paint:{"line-color":["case",["has","cote"],"#5C6166","#16181A"],"line-opacity":.9,
      "line-width":["interpolate",["linear"],["zoom"],4,["case",["has","cote"],.8,1.4],8,["case",["has","cote"],1.2,2.4]]}});
    map.addLayer({id:"hover",type:"line",source:"d",paint:{"line-color":"#16181A","line-width":1.5,
      "line-opacity":["case",["boolean",["feature-state","h"],false],1,0]}});
    map.addLayer({id:"sel",type:"line",source:"d",paint:{"line-color":"#1B3A8C","line-width":2.5,
      "line-opacity":["case",["boolean",["feature-state","s"],false],1,0]}});
    let hov=null;const tip=$("#tip");
    map.on("mousemove","fill",e=>{const f=e.features[0],id=f.properties.code;map.getCanvas().style.cursor="pointer";
      if(hov!==id){if(hov)map.setFeatureState({source:"d",id:hov},{h:false});hov=id;map.setFeatureState({source:"d",id},{h:true});}
      const d=carte?.deps[id];
      const rid=regOf["D"+id],rg=carte?.reg?.[rid];
      tip.innerHTML=map.getZoom()<6.3&&rid!==focusReg&&rg?`<b>${names[rid]}</b><br>${fmt(rg.s50)} en 2050 · ${pct(raw(rg))}`
        :`<b>${f.properties.nom}</b> <span style="opacity:.65">${names[rid]||""}</span><br>${d?fmt(d.s50)+" en 2050 · "+pct(raw(d)):"donnée absente"}`;
      tip.style.left=e.originalEvent.clientX+14+"px";tip.style.top=e.originalEvent.clientY+14+"px";tip.style.opacity=1;});

function pad(card){const w=innerWidth,h=innerHeight,wide=w>=1100,z=parseFloat(getComputedStyle($("#card")).zoom)||1;

  const left=!wide?16:card&&$("#levers").classList.contains("closed")?150:(card?150:$("#levers").offsetWidth*z+30);
  const right=wide&&card?$("#card").offsetWidth*z+28:16;
  return {left,right,top:Math.min(130,h*.14),bottom:24};}
// évolution : lue par rapport à l'évolution nationale (lexique : « au-dessus / en dessous de la moyenne »)
const raw=d=>S.v=="evo"?d.s50/d.s26-1:d.s50/d.b50-1;
const val=d=>S.v=="evo"&&carte?raw(d)-carte.nat:raw(d);
// paliers de l'écart au tendanciel : fixés tant que l'écart est faible, élargis par paliers ronds sinon
function brk(){if(S.v=="evo"||!carte)return BREAKS[S.v];const m=Math.max(...Object.values(carte.deps).map(d=>Math.abs(raw(d))));
  const top=[.08,.15,.3,.5,1].find(t=>m<=t)??1;return [-1,-.4,-.12,.12,.4,1].map(x=>Math.round(x*top*100)/100);}
// dégradé continu : 7 couleurs réparties de −B à +B (B = dernier palier), interpolées en RVB, bornées aux extrêmes
const hex=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
function colorOf(x){const B=brk().at(-1),t=Math.max(0,Math.min(1,(x/B+1)/2))*(RAMP.length-1),i=Math.min(RAMP.length-2,Math.floor(t)),f=t-i;
  const a=hex(RAMP[i]),b=hex(RAMP[i+1]);return "#"+a.map((v,k)=>Math.round(v+(b[k]-v)*f).toString(16).padStart(2,"0")).join("");}

function legend(){

// ---------- recalcul : un seul appel en vol, le dernier état gagne ----------
let inflight=null,pending=false,tInput=0;
async function refresh(){
  if(inflight){pending=true;return inflight;}
  writeHash();
  const q=`prof=${S.prof}&${LQ()}`;
  inflight=(async()=>{
    const [c,f]=await Promise.all([fetch(`/api/carte?${q}&terr=${S.terr||"FR"}`).then(r=>r.json()),
      S.terr?fetch(`/api/scenario?${q}&terr=${S.terr}`).then(r=>r.json()):null]);
    if(c.error){toast(c.error);return;}
    const T=k=>Object.values(c.deps).reduce((s,d)=>s+d[k],0);c.nat=T("s50")/T("s26")-1;carte=c;levState();paint();if(f&&!f.error)renderCard(f);renderCmp();
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));   // jusqu'à l'image affichée
    if(tInput){lat.push(performance.now()-tInput);tInput=0;showLat(c.ms);}
  })();
  try{await inflight}finally{inflight=null;if(pending){pending=false;refresh();}}
}
function paint(){legend();const R={};
  for(const [id,d] of Object.entries(carte.deps)){const r=regOf["D"+id];if(!r)continue;R[r]??={s26:0,s50:0,b50:0};for(const k in R[r])R[r][k]+=d[k];}
  carte.reg=R;
  for(const [id,d] of Object.entries(carte.deps)){const r=R[regOf["D"+id]];
    // région ouverte : les autres passent en gris uni (retour utilisateur·rice : l'estompage gênait la lecture)
    // territoire ouvert (région, ou département ; demain la commune) : tout ce qui est hors de lui passe en gris
    const inSel=!S.terr||S.terr=="FR"?true:S.terr.startsWith("D")?S.terr=="D"+id:regOf["D"+id]==S.terr;
    const dim=(!!focusReg&&regOf["D"+id]!=focusReg)||!inSel,G="#ECEDEE";
    map.setFeatureState({source:"d",id},{c:dim?G:colorOf(val(d)),cr:dim?G:r?colorOf(val(r)):colorOf(val(d)),f:!!focusReg&&regOf["D"+id]==focusReg,dim});}}
function setFocus(r){focusReg=r;if(carte)paint();}
const repaint=()=>{if(carte)paint();};
function showLat(ms){const s=[...lat].sort((a,b)=>a-b),q=p=>s[Math.min(s.length-1,Math.floor(p*s.length))];
  $("#lat").textContent=`réponse perçue p50 ${Math.round(q(.5))} ms · p95 ${Math.round(q(.95))} ms (n=${s.length}) · jumeau ${ms} ms`;window.__lat=s;}

// leviers par famille (former, attirer, installer, retenir), métadonnées lues dans /api/meta

const NOCOUNT=["dest","part_zones","quotas_region"];
const isDef=l=>S.lv[l.k]===(l.type=="toggle"?!!l.default:l.default);
function LQ(){return Object.entries(S.lv).map(([k,v])=>k+"="+(typeof v=="boolean"?+v:v)).join("&");}
function fmtL(l,v){return l.type=="toggle"?(v?"oui":"non"):l.type=="select"?"":l.fmt=="pct"?(v>=1?"+":"−")+Math.abs(Math.round((v-1)*100))+" %":l.fmt=="pct0"?Math.round(v*100)+" %":l.fmt=="ans"?"+"+String(v).replace(".",",")+(v>1?" ans":" an"):"× "+String(v).replace(".",",");}

const tw=new WeakMap();
function tween(el,to,f){const from=tw.get(el)??to*.96,t0=performance.now();tw.set(el,to);
  const step=t=>{const p=Math.min(1,(t-t0)/280),e=1-Math.pow(1-p,3);el.textContent=f(from+(to-from)*e);if(p<1)requestAnimationFrame(step);};requestAnimationFrame(step);}

function chart(f,i26){
  const W=460,H=250,P={l:40,r:8,t:8,b:20},y0=Math.min(f.obs[0]?.[0]??f.origin,f.origin),y1=2050;
  const lo=f.scn.map((v,i)=>v*(1-f.k*(f.years[i]-f.origin))),hi=f.scn.map((v,i)=>v*(1+f.k*(f.years[i]-f.origin)));
  const all=[...lo,...hi,...f.base,...f.obs.map(o=>o[1])],mn=Math.min(...all)*.97,mxv=Math.max(...all)*1.02;
  const X=y=>P.l+(y-y0)/(y1-y0)*(W-P.l-P.r),Y=v=>P.t+(1-(v-mn)/(mxv-mn))*(H-P.t-P.b);
  const path=(ys,vs)=>vs.map((v,i)=>(i?"L":"M")+X(ys[i]).toFixed(1)+" "+Y(v).toFixed(1)).join("");
  const band=path(f.years,hi)+f.years.slice().reverse().map((y,i)=>"L"+X(y).toFixed(1)+" "+Y(lo[lo.length-1-i]).toFixed(1)).join("")+"Z";
  const ticks=[mn,(mn+mxv)/2,mxv].map(v=>`<text x="${P.l-6}" y="${Y(v)+3}" text-anchor="end">${fmt(v)}</text>`).join("");
  const xt=[y0,f.origin,2035,2050].filter((v,i,a)=>a.indexOf(v)==i&&v>=y0).map(y=>`<text x="${X(y)}" y="${H-4}" text-anchor="middle">${y}</text>`).join("");
  $("#chart").innerHTML=`<defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="5" stroke="${PCOL[S.prof]}" stroke-opacity=".35" stroke-width="1.4"/></pattern></defs>
    <style>text{font:12px "IBM Plex Mono",monospace;fill:#8A8F94}</style>${ticks}${xt}
    <line x1="${X(2026)}" x2="${X(2026)}" y1="${P.t}" y2="${H-P.b}" stroke="#DCDED8" stroke-dasharray="2 3"/>
    <path d="${band}" fill="url(#hatch)"/>
    <path d="${path(f.obs.map(o=>o[0]),f.obs.map(o=>o[1]))}" fill="none" stroke="#16181A" stroke-width="1.6"/>
    <path d="${path(f.years,f.base)}" fill="none" stroke="#5C6166" stroke-width="1.2" stroke-dasharray="4 3"/>
    <path d="${path(f.years,f.scn)}" fill="none" stroke="${PCOL[S.prof]}" stroke-width="2"/>
    <text x="${W-P.r}" y="${Y(f.scn.at(-1))-6}" text-anchor="end" style="fill:${PCOL[S.prof]}">scénario</text>
    <text x="${W-P.r}" y="${Y(f.base.at(-1))+12}" text-anchor="end">tendanciel</text>`;
}

function addCmp(){if(!S.cmp.includes(S.terr)){S.cmp=[...S.cmp,S.terr].slice(-4);writeHash();renderCmp();toast("Ajouté à la comparaison");}}

    const a=ds.map(d=>carte.deps[d]).filter(Boolean),sum=k=>a.reduce((s,d)=>s+d[k],0),agg={s26:sum("s26"),s50:sum("s50"),b50:sum("b50")};

function exportCard(){
  if(!F)return;const L=[`# ${names[S.terr]} · ${F.label} · libéral · leviers ${LQ().replace(/&/g,' ')} · origine ${F.origin}`,"annee;tendanciel;scenario;bas;haut"];
  F.years.forEach((y,i)=>{const h=F.k*(y-F.origin);L.push([y,F.base[i],F.scn[i],F.scn[i]*(1-h),F.scn[i]*(1+h)].map(v=>typeof v=="number"&&v%1?v.toFixed(1):v).join(";"));});
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([L.join("\n")],{type:"text/csv"}));
  a.download=`fiche_${S.prof}_${S.terr}.csv`;a.click();
}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2200);}
// fil d'Ariane : France › région › département (› commune, à venir)
function parent(id){return !id||id=="FR"?null:id.startsWith("D")?regOf[id]||"FR":"FR";}
function crumb(){const chain=[];for(let t=S.terr||"FR";t;t=parent(t))chain.unshift(t);
  $("#crumb").innerHTML=chain.map((t,i)=>{const last=i==chain.length-1,mid=i>0&&!last?" mid":"";
    return (i?`<i class="${mid.trim()}">›</i>`:"")+(last?`<b>${names[t]||t}</b>`:`<button class="${mid.trim()}" data-t="${t}">${names[t]||t}</button>`)}).join("")
    +(chain.length>2?'<i class="ell">› …</i>':"");
  $("#crumb").querySelectorAll("button").forEach(b=>b.onclick=()=>b.dataset.t=="FR"?backToFrance():select(b.dataset.t));}
// précédent / suivant du navigateur
addEventListener("popstate",()=>{const t=new URLSearchParams(location.hash.slice(1)).get("t");if(t&&t!==S.terr)select(t,true,false);else if(!t&&S.terr)backToFrance(false);});
</script>
